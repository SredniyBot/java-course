name: Scaffold build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile production and tests; check formatting (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp -DskipTests clean package spotless:check
      - name: Compile production and tests; check formatting (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp -DskipTests clean package spotless:check
