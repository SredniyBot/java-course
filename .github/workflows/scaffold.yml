name: Scaffold build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile production and tests; check formatting (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp -DskipTests clean package spotless:check
      - name: Compile production and tests; check formatting (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp -DskipTests clean package spotless:check
      - name: Preview, platform, architecture and lab smoke tests (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp '-Dtest=ExercisePreviewTest,GamePanelTest,ArchitectureTest,GameIntegrationTest,CourseMenuTest,FuelTransferTest' '-Dsurefire.failIfNoSpecifiedTests=false' test
      - name: Preview, platform, architecture and lab smoke tests (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp '-Dtest=ExercisePreviewTest,GamePanelTest,ArchitectureTest,GameIntegrationTest,CourseMenuTest,FuelTransferTest' '-Dsurefire.failIfNoSpecifiedTests=false' test
